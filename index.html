<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexus</title>
<link rel="stylesheet" href="shared/theme.css"><script src="shared/prefs.js"></script><script src="shared/config.js"></script>
<style>
header{display:flex;gap:12px;align-items:center;padding:14px 24px;border-bottom:1px solid var(--line)}
h1{margin:0 16px 0 0;font-size:22px;font-weight:700;letter-spacing:.02em}
nav a{color:var(--mut);text-decoration:none;padding:6px 12px;border-radius:8px}nav a.on{color:var(--fg);background:var(--card)}
.sp{flex:1}main{padding:24px;max-width:1100px;margin:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}.list{display:flex;flex-direction:column;gap:10px}
.app{display:flex;gap:14px;align-items:center;padding:16px;background:var(--card);border:1px solid var(--line);border-radius:12px;color:inherit;text-decoration:none}
.grid .app{flex-direction:column;text-align:center;padding:24px 16px}.app:hover{border-color:var(--acc)}
.app img{width:60px;height:60px;border-radius:14px}.app h3{margin:0 0 4px;font-size:16px}.app p{margin:0;color:var(--mut)}
iframe{width:100%;height:calc(100vh - 120px);border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.cf{margin:0 0 22px}.cf h3{margin:0 0 6px}.cf small{color:var(--mut);font-weight:400}.cf textarea{width:100%;display:block;margin-bottom:8px;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px;font:12px Consolas,monospace}
</style></head><body>
<header><h1>Nexus</h1><nav><a href="#/" id="n1">Apps</a><a href="#/files" id="n2">Files</a><a href="#/settings" id="n3">Settings</a></nav><span class="sp"></span>
<input id="q" placeholder="Search apps"><button id="vw" title="Switch grid / list">Grid / list</button><button id="th" title="Switch theme">Theme</button></header>
<main><section id="av"><div id="apps"></div></section><section id="fv" hidden><iframe id="fr" title="Files"></iframe></section><section id="sv" hidden></section><section id="sv" hidden></section></main>
<script>
var $=function(s){return document.querySelector(s)},apps=[];
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return'&#'+c.charCodeAt(0)+';'})};
function draw(){var q=$('#q').value.toLowerCase(),v=apps.filter(function(a){return(a.name+' '+(a.description||'')).toLowerCase().indexOf(q)>-1});
 $('#apps').className=NexusPrefs.get().view||'grid';
 $('#apps').innerHTML=v.length?v.map(function(a){var d=a.path.replace(/\/?$/,'/');
  return'<a class="app" href="'+esc(d+(a.entry||'index.html')+(a.route||''))+'"><img alt="" src="'+esc(d+a.icon)+'"><div><h3>'+esc(a.name)+'</h3><p>'+esc(a.description||'')+'</p></div></a>'}).join(''):'<p>No apps found. Check installed_apps.json.</p>'}
function route(){var h=location.hash,f=h=='#/files',s=h=='#/settings';$('#av').hidden=f||s;$('#fv').hidden=!f;$('#sv').hidden=!s;$('#q').hidden=$('#vw').hidden=f||s;
 ['n1','n2','n3'].forEach(function(id,i){$('#'+id).className=i==(f?1:s?2:0)?'on':''});
 if(f&&!$('#fr').getAttribute('src'))$('#fr').src='explorer.html?mode=manage';if(s)cfgs()}
function cfgs(){var ks=NexusConfig.keys();$('#sv').innerHTML='<h2>App settings</h2><p>Apps keep their settings here. Edit the JSON and save, or reset an entry to its defaults.</p>'+(ks.length?ks.map(function(k){var r=NexusConfig.raw(k),big=r.length>4000;
 return'<div class="cf"><h3>'+esc(k)+' <small>'+Math.ceil(r.length/1e3)+' KB</small></h3>'+(big?'':'<textarea data-k="'+esc(k)+'" rows="6">'+esc(r)+'</textarea><button class="pri" data-s="'+esc(k)+'">Save</button> ')+'<button data-r="'+esc(k)+'">Reset</button></div>'}).join(''):'<p>No app has saved settings yet.</p>')}
$('#sv').onclick=function(e){var s=e.target.dataset.s,r=e.target.dataset.r;
 if(s){try{NexusConfig.set(s,JSON.parse(document.querySelector('textarea[data-k="'+s+'"]').value));e.target.textContent='Saved'}catch(x){alert('That is not valid JSON.')}}
 if(r&&confirm('Reset '+r+' to its defaults?')){NexusConfig.del(r);cfgs()}};
$('#q').oninput=draw;
$('#vw').onclick=function(){NexusPrefs.set({view:NexusPrefs.get().view=='list'?'grid':'list'});draw()};
$('#th').onclick=function(){var t=NexusPrefs.theme()=='dark'?'light':'dark';NexusPrefs.set({theme:t});NexusPrefs.theme();try{$('#fr').contentDocument.documentElement.dataset.t=t}catch(e){}};
addEventListener('hashchange',route);route();
(function next(u){if(!u.length)return draw();fetch(u[0]).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){apps=j.apps||j;draw()},function(){next(u.slice(1))})})(['installed_apps.json','apps.json']);
</script></body></html>
