<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Icon Bench</title>
<link rel="icon" href="icon.svg"><link rel="stylesheet" href="../../shared/theme.css"><link rel="stylesheet" href="../../shared/dock.css"><script src="../../shared/prefs.js"></script><script src="../../shared/config.js"></script>
<style>
body{display:flex;flex-direction:column;height:100vh}
header{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid var(--line)}header a{color:var(--mut);text-decoration:none}
#root{flex:1;display:flex;min-height:0}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0}.row input[type=range],.row input:not([type]),.row select{flex:1;min-width:0}
.gl{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}.gl button{padding:5px;aspect-ratio:1}.gl button.on{border-color:var(--acc);background:var(--bg)}.gl svg{width:100%;height:100%;fill:currentColor}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;gap:20px;padding:24px;margin:auto}
.big{width:256px;height:256px;border-radius:10px;background:repeating-conic-gradient(#8884 0 25%,#0000 0 50%) 0 0/16px 16px}.big img{width:100%;height:100%}
.sm{display:flex;gap:18px;align-items:flex-end}.acts{display:flex;flex-wrap:wrap;gap:8px}small{color:var(--mut)}
</style></head><body>
<header><a href="../../">&larr; Nexus</a><b>Icon Bench</b></header>
<div id="root"></div>
<script src="vendor/react.production.min.js"></script><script src="vendor/react-dom.production.min.js"></script><script src="vendor/htm.js"></script>
<script src="../../sdk/portal-sdk.js"></script>
<script type="module">import App from './src/App.js';ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App))</script>
</body></html>
