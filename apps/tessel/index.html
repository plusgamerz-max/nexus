<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tessel</title>
<link rel="icon" href="icon.svg"><link rel="stylesheet" href="../../shared/theme.css"><link rel="stylesheet" href="../../shared/dock.css"><script src="../../shared/prefs.js"></script><script src="../../shared/config.js"></script>
<style>
body{display:flex;flex-direction:column;height:100vh}
header{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid var(--line)}header a{color:var(--mut);text-decoration:none}
#root{flex:1;display:flex;min-height:0}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:5px 0}.row input[type=number]{width:90px}.row input[type=range]{flex:1}
.tb{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.tb button.on{border-color:var(--acc);background:var(--bg)}.sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.cw{margin:auto;padding:20px}.pv{display:block;image-rendering:pixelated;touch-action:none;cursor:crosshair;background:repeating-conic-gradient(#8885 0 25%,#0000 0 50%) 0 0/16px 16px;box-shadow:0 0 0 1px var(--line)}
.fl{display:flex;flex-direction:column;gap:8px;margin-top:10px}.fr{position:relative;display:flex;gap:10px;align-items:center;padding:6px;border:1px solid var(--line);border-radius:8px;cursor:pointer}.fr.on{border-color:var(--acc)}
.th,.pvw canvas{image-rendering:pixelated;background:repeating-conic-gradient(#8885 0 25%,#0000 0 50%) 0 0/8px 8px}.th{max-width:72px;max-height:72px}
.fa{display:none;position:absolute;right:4px;top:4px;gap:4px;background:var(--card);padding:3px;border-radius:6px;border:1px solid var(--line)}.fa button{padding:2px 6px;font-size:12px}.fr:hover .fa,.fr.on .fa{display:flex}
.pal{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin:8px 0}.pal button{aspect-ratio:1;padding:0;border-radius:4px}.pal button.on{outline:2px solid var(--acc)}
.sn{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.sn .s{position:relative;border:1px solid var(--line);border-radius:8px;padding:4px;background:var(--bg);cursor:grab}.sn img{width:100%;image-rendering:pixelated;display:block}.sn .s button{position:absolute;top:0;right:0;padding:0 6px;border:0;background:none}
.acts{display:flex;flex-wrap:wrap;gap:6px}small{color:var(--mut)}.pvw{display:flex;gap:16px;align-items:center}
</style></head><body>
<header><a href="../../">&larr; Nexus</a><b>Tessel</b></header>
<div id="root"></div>
<script src="vendor/react.production.min.js"></script><script src="vendor/react-dom.production.min.js"></script><script src="vendor/htm.js"></script>
<script src="../../sdk/portal-sdk.js"></script>
<script type="module">import App from './src/App.js';ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App))</script>
</body></html>
